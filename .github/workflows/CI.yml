#CI pipeline for portfolio project

on:
  workflow_dispatch:

permissions:
  contents: write
#Docker hub image repo
env:
  DOCKERHUB_REPO_1: harsh9308/devops-portfolio


jobs:
  build-and-push-portfolio-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup Node Env
        uses: actions/setup-node@v4
        with:
                node-version: '26'
                cache: 'npm'

      - name: Install dependencies and test
        run: |
          npm ci

      - name: Set image tag
        id: tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image for portfolio
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_1 }}:latest
            ${{ env.DOCKERHUB_REPO_1 }}:${{ steps.tag.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max