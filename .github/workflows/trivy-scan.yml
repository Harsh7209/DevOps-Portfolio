name: Trivy scan for docker image
on:
  workflow_dispatch:
jobs:
  Trivy_scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image using buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: harsh9308/devops-portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "harsh9308/devops-portfolio:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
