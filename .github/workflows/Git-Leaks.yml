name: Secret leaks Scan

on: push
jobs: 
    Secret_leaks_detection:
        runs-on: ubuntu-latest
        steps: 
            - name: code checkout
              uses:  actions/checkout@v4
              with: 
                fetch-depth: 0

            - name: Run gitleaks check
              uses: gitleaks/gitleaks-action@v2
              env:
               GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}