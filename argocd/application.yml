# argo cd configurationn file for skillpulse application
#Fully automated
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Harsh7209/DevOps-Portfolio.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
